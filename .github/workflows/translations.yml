name: Validate translations

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  pull_request:
    types: [ opened, synchronize ]
    paths-ignore:
      - '*.md'

concurrency:
  # Only pull request runs are superseded by newer pushes; builds on main and release runs always finish
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install polib
      run: sudo apt-get update && sudo apt-get install -y python3-polib

    - name: Check
      working-directory: ${{github.workspace}}
      shell: bash
      run: python3 tools/validate_translations.py
