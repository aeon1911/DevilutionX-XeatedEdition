---
name: Xeated Switch

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags:
      - 'xe-*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (for example xe-1.0.0); leave empty to only build'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update && \
          apt-get install -y --no-install-recommends --no-install-suggests \
            gettext

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake

      - name: Build DevilutionX Xeated Edition
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p package/switch/devilutionx
          cp build/devilutionx.nro package/switch/devilutionx/devilutionx.nro
          cp Packaging/switch/README.txt package/switch/devilutionx/README.txt

      - name: Upload Package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: devilutionx-xeated.nro
          path: package

      - name: Zip Package
        if: ${{ startsWith(github.ref, 'refs/tags/xe-') || inputs.release_tag != '' }}
        run: |
          apt-get install -y --no-install-recommends --no-install-suggests zip
          cd package && zip -r ../DevilutionX-XeatedEdition-switch.zip switch

      - name: Create Release
        if: ${{ (startsWith(github.ref, 'refs/tags/xe-') || inputs.release_tag != '') && !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DevilutionX Xeated Edition ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/xeated/RELEASE_NOTES.md
          files: |
            DevilutionX-XeatedEdition-switch.zip
            build/devilutionx.nro
...
